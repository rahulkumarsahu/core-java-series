# Proposed configuration contract. Values are safe starting points, not current production facts.
schema_version: "failure-policy/v1"
policy_id: "failure-analysis-v1"
rule_version: "1.0.0"

baseline_lookup:
  # Baseline ownership has exactly these four fields. Version is resolved below it.
  key_fields:
    - "seal_id"
    - "project_id"
    - "repo_id"
    - "source_type"
  allowed_source_types:
    - "JULES"
    - "LATTICE"

compatibility:
  require_exact:
    - "source_schema_version"
    - "source_adapter_version"
    - "scope_segmenter_version"
    - "normalization_rule_version"
    - "redaction_rule_version"
    - "masking_rule_version"
    - "drain_config_version"
    - "template_format_version"
    - "fingerprint_version"
  allow_tested_migrations_only: true
  refuse_cross_source_comparison: true
  fallback_without_baseline:
    enabled: true
    confidence_cap: 0.55
    signals:
      - "explicit_failure"
      - "nonzero_exit"
      - "failed_test"
      - "stack_trace"
      - "failed_scope"
      - "tail_proximity"

comparison:
  exact_fingerprint_match: true
  confirm_canonical_text_on_algorithm_migration: true
  new_template_minimum_count: 1
  missing_template_minimum_success_support: 0.80
  frequency_shift:
    # A shift is notable if either ratio or standardized distance exceeds its limit.
    minimum_baseline_count: 3
    ratio_threshold: 3.0
    standardized_distance_threshold: 3.0
  sequence:
    enabled: true
    maximum_transition_distance: 4
  stage_local_rarity_threshold: 0.05
  parameter_features:
    duration_ratio_threshold: 4.0
    memory_limit_fraction_threshold: 0.90

severity_mapping:
  # Values are normalized to [0, 1].
  fatal: 1.00
  error: 0.90
  failed_test: 0.85
  timeout: 0.80
  warning: 0.35
  info: 0.10
  debug: 0.00
  preserved_exit_codes:
    "0": 0.00
    "1": 0.75
    "2": 0.70
    "137": 1.00

content_expansion:
  default_window:
    before_logical_lines: 4
    after_logical_lines: 6
    time_before_ms: 10000
    time_after_ms: 5000
  extend_to_boundaries:
    - "stack_trace"
    - "exception_chain"
    - "test_failure"
    - "compiler_diagnostic"
    - "shell_continuation"
    - "task_transition"
  correlation:
    enabled: true
    use_protected_digest_only: true
    maximum_matches_per_candidate: 25
  dependency_expansion:
    enabled: true
    maximum_graph_hops: 1
    summary_only_by_default: true

block_construction:
  stop_at_scope_boundary: true
  merge_overlapping_windows: true
  merge_maximum_gap_lines: 2
  maximum_block_lines: 240
  maximum_block_bytes: 65536
  maximum_block_tokens_estimate: 6000
  split_at_safe_boundaries: true
  retry_loop:
    compress_after_occurrences: 5
    representative_examples:
      - "first"
      - "last"
      - "most_anomalous"

deduplication:
  exact_content_hash: true
  canonical_content_hash: true
  template_sequence_similarity_threshold: 0.90
  near_duplicate_similarity_threshold: 0.92
  collapse_across_scopes: false
  retain:
    - "occurrence_count"
    - "first_occurrence"
    - "last_occurrence"
    - "logical_scopes"
    - "attempts"
    - "parameter_ranges"
    - "representative_examples"
    - "source_ranges"

scoring:
  formula: "100 * clamp(weighted_positive_sum - weighted_penalty_sum, 0, 1)"
  variable_range:
    minimum: 0.0
    maximum: 1.0
  normalization:
    # Frequency reaches 1.0 at either a 3x ratio or three standardized distances.
    frequency_smoothing_count: 0.5
    frequency_minimum_standard_deviation: 1.0
    frequency_ratio_at_maximum: 3.0
    frequency_standardized_distance_at_maximum: 3.0
    # Proximity is 0.5 at this many logical lines from the first failure.
    failure_proximity_half_value_lines: 20
    directly_relevant_dependency_scope: 0.60
    incomplete_structured_diagnostic: 0.50
    # Occurrences beyond this representative limit accumulate repetition penalty.
    repetition_representative_limit: 5
  weights:
    template_novelty: 0.22
    severity: 0.22
    frequency_shift: 0.12
    failure_proximity: 0.12
    scope_relevance: 0.10
    stack_or_structured_diagnostic: 0.08
    failing_entity_correlation: 0.08
    source_confidence: 0.06
  penalties:
    excessive_repetition: 0.10
    duplicate_overlap: 0.10
  rule_adjustments:
    - rule_id: "force-nonzero-terminal-exit-v1"
      when:
        signal: "nonzero_terminal_exit"
      action: "require_inclusion"
      reason: "Preserve definitive outcome evidence."

    - rule_id: "boost-first-causal-timeout-v1"
      when:
        signal: "first_correlated_timeout"
      score_boost: 0.05
      maximum_final_score: 1.0
      reason: "Prefer the earliest correlated timeout over its repeated consequences."

    - rule_id: "penalize-routine-cleanup-v1"
      when:
        template_category: "routine_cleanup"
        explicit_failure: false
      score_penalty: 0.10
      reason: "Routine cleanup rarely explains the failure."
  tie_breakers:
    - "mandatory_inclusion_first"
    - "structured_or_causal_evidence_first"
    - "higher_source_confidence"
    - "closer_logical_proximity"
    - "earlier_physical_occurrence"
    - "block_id_ascending"

selection:
  stage_quotas:
    failed_scope_minimum_blocks: 2
    upstream_scope_minimum_blocks_when_signaled: 1
    maximum_fraction_from_one_scope: 0.70
  category_quotas:
    maximum_fraction_from_one_category: 0.50
    maximum_near_duplicates: 1
  preserve_structural_units:
    - "stack_trace"
    - "exception_chain"
    - "compiler_diagnostic"
    - "test_failure"
  fallback_summary_when_block_cannot_fit: true

token_budget:
  tokenizer: "target_model_tokenizer"
  total_context_tokens: 32000
  reservations:
    instructions: 3000
    failure_metadata_and_diff: 2000
    retrieved_knowledge_and_code: 6000
    model_response: 5000
    safety_margin: 2000
  calculated_log_evidence_budget: 14000
  recalculate_after_expansion_and_deduplication: true
  truncate_at_safe_boundaries_only: true

candidate_pool:
  immutable_records: true
  idempotent_candidate_ids: true
  optimistic_control_record_versioning: true
  worker_lease_seconds: 30
  maximum_lease_renewals_without_progress: 3
  limits_per_analysis:
    maximum_candidates: 50000
    maximum_expanded_bytes: 104857600
    maximum_active_workers: 8
    maximum_inflight_read_bytes: 8388608
  fairness:
    scheduler: "weighted_round_robin"
    maximum_consecutive_chunks_per_analysis: 4
  expiration_seconds: 604800
  cancellation_check_every_records: 100

timeouts_ms:
  baseline_resolution: 5000
  candidate_detection: 120000
  single_range_read: 10000
  single_expansion: 15000
  scoring_and_selection: 30000

source_overrides:
  jules:
    primary_order: "stage_local_sequence"
    allow_physical_neighbor_expansion: true
    stop_at_stage_boundary: true
    dependency_expansion:
      enabled: false

  lattice:
    primary_order: "dag_node_local_sequence"
    allow_physical_neighbor_expansion: false
    separate_node_attempts: true
    preserve_noncontiguous_source_ranges: true
    dependency_expansion:
      enabled: true
      maximum_graph_hops: 1

validation:
  require_positive_weights_sum: 1.0
  require_normalized_variables: true
  require_nonnegative_limits: true
  require_source_override_for:
    - "jules"
    - "lattice"
  reject_cross_seal_references: true
  reject_missing_analysis_id: true
  reject_unversioned_rules: true
