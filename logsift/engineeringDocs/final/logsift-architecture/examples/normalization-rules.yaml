# Safe example policy. Patterns use synthetic values only.
# The repository does not currently define this file format; this is a proposed contract.
schema_version: "normalization-policy/v1"
policy_id: "normalization-rules-v1"
rule_version: "1.0.0"

execution:
  deterministic: true
  # This order is invariant even if a rule has an incorrect local priority.
  phase_order:
    - source_envelope
    - normalize
    - redact
    - mask
    - canonicalize
  tie_breaker: "rule_id_ascending"
  fail_closed_on_redaction_error: true
  # Physical provenance is captured before transformation. Derived text may combine
  # a multiline secret into one marker while retaining the complete source range.
  preserve_source_provenance: true
  preserve_derived_line_count: false
  maximum_rule_runtime_ms: 50
  maximum_match_ratio: 0.40

source_rules:
  jules:
    - rule_id: "jules-stage-prefix-v1"
      phase: "source_envelope"
      priority: 10
      enabled: true
      match: '^\[(?<stage>[A-Za-z0-9_.-]+)\]\s+(?<message>.*)$'
      extract:
        logical_scope_kind: "stage"
        logical_scope_id: "${stage}"
        message: "${message}"
      on_no_match: "retain_message_and_lower_structure_confidence"

  lattice:
    - rule_id: "lattice-node-prefix-v1"
      phase: "source_envelope"
      priority: 10
      enabled: true
      match: '^\[(?<build_type>[A-Za-z0-9_.-]+):(?<stage>[A-Za-z0-9_.-]+)\]\s+(?<message>.*)$'
      extract:
        logical_scope_kind: "dag_node"
        logical_scope_id: "${build_type}:${stage}"
        message: "${message}"
      on_no_match: "retain_message_and_lower_structure_confidence"

shared_rules:
  normalization:
    - rule_id: "normalize-ansi-controls-v1"
      phase: "normalize"
      priority: 100
      enabled: true
      operation: "strip_ansi_and_unsafe_controls"
      preserve:
        - "tab"
        - "line_feed"

    - rule_id: "normalize-timestamp-prefix-v1"
      phase: "normalize"
      priority: 110
      enabled: true
      # Extract the time as metadata, then use a typed token in canonical text.
      match: '^(?<timestamp>\d{4}-\d{2}-\d{2}T[^ ]+)\s+(?<message>.*)$'
      extract:
        observed_at: "${timestamp}"
        message: "${message}"

  redaction:
    - rule_id: "redact-credential-pair-v1"
      phase: "redact"
      priority: 200
      enabled: true
      # Synthetic key names; the replacement never includes the matched value.
      match: '(?i)\b(password|passwd|access_token|api_token)\s*[=:]\s*[^\s,;]+'
      replacement: "<REDACTED_SECRET>"
      audit_category: "credential_pair"
      retain_match_value_in_audit: false

    - rule_id: "redact-private-key-block-v1"
      phase: "redact"
      priority: 205
      enabled: true
      multiline: true
      match: '(?s)-----BEGIN [A-Z ]*PRIVATE KEY-----.*?-----END [A-Z ]*PRIVATE KEY-----'
      replacement: "<REDACTED_PRIVATE_KEY>"
      audit_category: "private_key"
      retain_match_value_in_audit: false

    - rule_id: "redact-url-userinfo-v1"
      phase: "redact"
      priority: 210
      enabled: true
      match: '(?<scheme>https?)://[^/@\s]+@(?<host>[^/\s]+)'
      replacement: "${scheme}://<REDACTED_SECRET>@${host}"
      audit_category: "url_userinfo"
      retain_match_value_in_audit: false

  masking:
    - rule_id: "mask-uuid-v1"
      phase: "mask"
      priority: 300
      enabled: true
      match: '\b[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}\b'
      replacement: "<UUID>"

    - rule_id: "mask-ip-address-v1"
      phase: "mask"
      priority: 310
      enabled: true
      match: '\b(?:\d{1,3}\.){3}\d{1,3}\b'
      replacement: "<IP_ADDRESS>"
      except_when:
        # Safe semantic exceptions are explicit and testable.
        exact_values:
          - "127.0.0.1"

    - rule_id: "mask-duration-v1"
      phase: "mask"
      priority: 320
      enabled: true
      match: '\b\d+(?:\.\d+)?(?:ms|s|min|h)\b'
      replacement: "<DURATION>"
      emit_numeric_feature: "duration_ms"

    - rule_id: "mask-memory-size-v1"
      phase: "mask"
      priority: 330
      enabled: true
      match: '\b\d+(?:\.\d+)?\s*(?:KiB|MiB|GiB|KB|MB|GB)\b'
      replacement: "<MEMORY_SIZE>"
      emit_numeric_feature: "memory_bytes"

    - rule_id: "mask-build-id-v1"
      phase: "mask"
      priority: 340
      enabled: true
      match: '(?i)(?<prefix>\bbuild(?:_id)?[=: ]+)\d+\b'
      replacement: "${prefix}<BUILD_ID>"

    - rule_id: "mask-passed-count-v1"
      phase: "mask"
      priority: 342
      enabled: true
      match: '(?<prefix>\bpassed[=: ]+)\d+\b'
      replacement: "${prefix}<COUNT>"
      emit_numeric_feature: "passed_count"

    - rule_id: "mask-nonzero-failure-count-v1"
      phase: "mask"
      priority: 344
      enabled: true
      # Preserve failed=0 exactly; classify positive counts and retain the magnitude.
      match: '(?<prefix>\bfailed[=: ]+)[1-9]\d*\b'
      replacement: "${prefix}<NONZERO_COUNT>"
      emit_numeric_feature: "failed_count"

    - rule_id: "mask-commit-sha-v1"
      phase: "mask"
      priority: 350
      enabled: true
      match: '\b[0-9a-fA-F]{7,40}\b'
      replacement: "<COMMIT_SHA>"
      except_when:
        # A preceding error-code label is diagnostic and is not a commit hash.
        preceded_by: "error_code="

allow_list:
  preserved_semantic_patterns:
    - allow_id: "preserve-exit-code-v1"
      priority: 50
      match: '(?i)\bexit(?:ed)?(?: code| status)?[=: ]+\d+\b'
      reason: "Exit status changes diagnostic meaning."

    - allow_id: "preserve-source-location-v1"
      priority: 55
      match: '(?:[A-Za-z0-9_.-]+/)+[A-Za-z0-9_.-]+:\d+(?::\d+)?'
      reason: "Source file and line references guide diagnosis."

validation:
  require_unique_rule_ids: true
  require_monotonic_phase_order: true
  reject_empty_match_patterns: true
  reject_replacements_containing_capture_named: "secret"
  protected_tokens:
    - "exit code"
    - "exception"
    - "failed"
  tests:
    - name: "jules envelope and typed masking"
      source: "jules"
      input: "[test] 2026-08-23T09:10:01Z worker 10.2.3.4 finished in 812ms"
      expected_scope: "test"
      expected_text: "worker <IP_ADDRESS> finished in <DURATION>"

    - name: "lattice node remains distinct"
      source: "lattice"
      input: "[service-test:integration] worker 10.8.7.6 exited code=137"
      expected_scope: "service-test:integration"
      expected_text: "worker <IP_ADDRESS> exited code=137"

    - name: "synthetic credential is removed"
      source: "jules"
      input: "[deploy] access_token=example-not-a-real-token request failed"
      expected_text: "<REDACTED_SECRET> request failed"
      forbidden_output_substrings:
        - "example-not-a-real-token"

    - name: "loopback allow-list exception"
      source: "jules"
      input: "[test] service listening on 127.0.0.1 exit code=0"
      expected_text: "service listening on 127.0.0.1 exit code=0"
